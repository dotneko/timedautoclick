[project]
name = "timedautoclick"
version = "0.1.0"
description = "Autoclicker utilizing cliclick for macOS that triggers at a specified time"
readme = "README.md"
authors = [
    { name = "dotneko", email = "dotneko@zmb20.local" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
timedautoclick = "timedautoclick:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
